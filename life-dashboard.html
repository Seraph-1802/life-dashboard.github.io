<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: https://azure.assets.harvey.ai; connect-src 'none'; webrtc 'block'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131526;--bg-card:#1E1F35;--bg-card-hover:#262840;--bg-input:#16172B;
  --accent:#C8956C;--accent-hover:#D4A57E;--accent-dim:rgba(200,149,108,.15);
  --text:#A0A0B8;--text-bright:#E8E8F0;--text-muted:#6B6B80;
  --border:#2A2B42;--border-light:#353650;
  --red:#E06070;--green:#60C090;--blue:#7B8CDE;
  --amber:#F5A623;--orange:#FF8F00;--yellow:#FFD600;
  --radius:12px;--radius-sm:8px;--radius-pill:999px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
}
html{font-size:15px}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);flex-wrap:wrap;gap:10px}
.topnav-brand{display:flex;align-items:center;gap:10px}
.topnav-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#E8A87C);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.topnav-title{font-size:17px;font-weight:600;color:var(--text-bright);letter-spacing:-.3px}
.topnav-tabs{display:flex;gap:0;flex-wrap:wrap}
.topnav-tab{padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:color .15s ease,border-color .15s ease;border:none;background:transparent;color:#5a6b80;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:5px}
.topnav-tab.active{color:#e0e0e0;border-bottom-color:var(--amber)}
.topnav-tab:not(.active):hover{color:rgba(255,255,255,.7)}
.topnav-tab .tab-icon{font-size:13px}
.topnav-gear{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:6px;border-radius:6px;transition:var(--transition);display:none;align-items:center}
.topnav-gear:hover{color:var(--text-bright);background:var(--bg-card-hover)}

.main-container{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.section-title{font-size:18px;font-weight:600;color:var(--text-bright);margin-bottom:16px;letter-spacing:-.3px}
.section-subtitle{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:400}
.tab-page{display:none;animation:fadeIn .3s ease}.tab-page.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:var(--transition)}

.pill-tabs{display:flex;gap:3px;background:var(--bg-input);padding:3px;border-radius:var(--radius-pill);margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.pill-tab{padding:7px 18px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;cursor:pointer;transition:var(--transition);border:none;background:transparent;color:var(--text-muted)}
.pill-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(200,149,108,.25)}
.pill-tab:not(.active):hover{color:var(--text);background:var(--bg-card-hover)}

.item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;transition:var(--transition);animation:slideIn .25s ease;flex-wrap:wrap}
.item-row:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.drag-handle{display:flex;flex-direction:column;gap:2px;cursor:grab;padding:3px;opacity:.3;transition:opacity .2s}
.drag-handle:hover{opacity:.7}
.drag-handle span{display:flex;gap:3px}
.drag-handle span i{width:3px;height:3px;background:var(--text-muted);border-radius:50%;display:block}

.item-label,.ed-input{flex:1;font-size:13px;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit;min-width:80px}
.item-label::placeholder,.ed-input::placeholder{color:var(--text-muted)}
.item-label:focus,.ed-input:focus{color:#fff}
.item-amount,.ed-amount{width:100px;text-align:right;font-size:14px;font-weight:600;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit;font-variant-numeric:tabular-nums}
.item-amount:focus,.ed-amount:focus{color:#fff}
.item-amount::placeholder,.ed-amount::placeholder{color:var(--text-muted)}
.item-currency{font-size:12px;color:var(--text-muted);margin-left:2px}
.ed-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;cursor:pointer;max-width:150px}
.ed-select:focus{border-color:var(--accent)}
.ed-date{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;width:130px}
.ed-date:focus{border-color:var(--accent)}
.ed-small{width:70px;text-align:right;font-size:13px;font-weight:500;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit}

.item-delete{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:5px;border-radius:6px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.item-delete:hover{color:var(--red);background:rgba(224,96,112,.1)}
.item-delete svg{width:15px;height:15px}
.add-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-pill);background:var(--accent-dim);color:var(--accent);border:1px dashed rgba(200,149,108,.3);cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;transition:var(--transition);margin-top:4px}
.add-btn:hover{background:rgba(200,149,108,.25);border-color:var(--accent)}
.add-btn svg{width:15px;height:15px}

.summary-text{font-size:13px;line-height:1.7;color:var(--text);padding:14px 18px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:16px}
.summary-text strong{color:var(--text-bright);font-weight:600}
.summary-text .highlight{color:var(--accent);font-weight:600}

.sankey-container{position:relative;margin-top:20px;overflow:visible}
.sankey-container svg{width:100%;display:block}
.sankey-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-muted);text-align:center}
.sankey-empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.3}
.sankey-empty p{font-size:13px;line-height:1.6}

.gauge-wrapper{display:flex;flex-direction:column;align-items:center;padding:16px}
.gauge-svg{width:200px;height:120px}
.gauge-value{font-size:32px;font-weight:700;color:var(--text-bright);margin-top:6px;font-variant-numeric:tabular-nums}
.gauge-label{font-size:12px;color:var(--text-muted);margin-top:3px}
.gauge-sublabel{font-size:11px;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;gap:5px}
.gauge-sublabel .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.summary-table{width:100%;border-collapse:separate;border-spacing:0}
.summary-table th{text-align:left;font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;border-bottom:1px solid var(--border)}
.summary-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.summary-table tr:last-child td{border-bottom:none;font-weight:600;color:var(--text-bright)}
.summary-table .label{color:var(--text)}
.summary-table .value{text-align:right;font-weight:600;color:var(--text-bright);font-variant-numeric:tabular-nums}
.summary-table .positive{color:var(--green)}.summary-table .negative{color:var(--red)}.summary-table .accent-val{color:var(--accent)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
@media(max-width:1000px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.kpi{text-align:center;padding:18px 14px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text-bright);font-variant-numeric:tabular-nums}
.kpi-value.gold{color:var(--accent)}
.kpi-value.green{color:var(--green)}
.kpi-value.red{color:var(--red)}
.kpi-label{font-size:11.5px;color:var(--text-muted);margin-top:4px}

.progress-wrap{width:100%;height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;border-radius:4px;transition:width .4s ease;background:var(--accent)}
.progress-bar.green{background:var(--green)}

.expand-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:inherit;padding:4px 0;transition:var(--transition)}
.expand-btn:hover{color:var(--accent-hover)}
.amort-table{width:100%;font-size:11.5px;margin-top:10px;border-collapse:collapse}
.amort-table th{text-align:left;color:var(--text-muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase}
.amort-table td{padding:5px 8px;color:var(--text);border-bottom:1px solid rgba(42,43,66,.5);font-variant-numeric:tabular-nums}

.ms-wrap{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ms-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-pill);background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:500}
.ms-tag button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}

.donut-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:10px 0}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.donut-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.hero-net{text-align:center;padding:28px 20px}
.hero-net-value{font-size:42px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.hero-net-label{font-size:13px;color:var(--text-muted);margin-top:6px}

.cat-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;cursor:pointer;max-width:140px}
.cat-select:focus{border-color:var(--accent)}

.field-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field-label{font-size:11px;color:var(--text-muted);white-space:nowrap}

.badge-plafond{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:600;margin-left:6px}
.badge-plafond.warning{background:rgba(245,166,35,.15);color:var(--amber)}
.badge-plafond.ok{background:rgba(96,192,144,.1);color:var(--green)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-title{font-size:17px;font-weight:600;color:var(--text-bright);margin-bottom:18px}
.modal-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:var(--transition);border:1px solid var(--border);background:var(--bg-input);color:var(--text-bright);width:100%;margin-bottom:10px}
.modal-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
.modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-btn.primary:hover{background:var(--accent-hover)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;padding:4px}
.modal-close:hover{color:var(--text-bright)}

.time-selector{display:flex;gap:4px;background:var(--bg-input);padding:3px;border-radius:var(--radius-pill)}
.time-btn{padding:5px 12px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;background:transparent;color:#5a6b80}
.time-btn.active{background:rgba(255,171,0,.15);color:var(--amber)}
.time-btn:hover:not(.active){color:var(--text)}

.toggle-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;transition:var(--transition)}
.toggle-btn:hover{border-color:var(--accent);color:var(--accent)}

.fiscal-panel{display:none;margin-top:8px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;color:var(--text);line-height:1.6}
.fiscal-panel.open{display:block}
.fiscal-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600}
.fiscal-badge.locked{background:rgba(255,143,0,.15);color:var(--orange)}
.fiscal-badge.unlocked{background:rgba(96,192,144,.1);color:var(--green)}

.completion-pct{font-size:12px;font-weight:700;color:var(--text-bright);white-space:nowrap}
.completion-pct.over{color:var(--amber)}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand">
    <div class="topnav-logo">L</div>
    <span class="topnav-title">Life Dashboard</span>
  </div>

</nav>

<div class="main-container">
  <div id="page-budget" class="tab-page active"></div>
  <div id="page-epargne" class="tab-page"></div>
  <div id="page-investissements" class="tab-page"></div>

<script>
// ═══════════════════════════════════════════════════
// GLOBAL HELPERS
// ═══════════════════════════════════════════════════
function genId(){return '_'+Math.random().toString(36).substr(2,9)}
function fmt(n){return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}
function fmtDec(n,d){return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}
function escHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escSVG(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pf(v){return parseFloat(v)||0}

var ICON_TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
var ICON_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
var ICON_FLOW='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 12h8c6 0 6 12 12 12h12"/><path d="M8 24h8c6 0 6-12 12-12h12"/><path d="M8 36h8c6 0 6-12 12-12h12"/></svg>';
function dragH(){return '<div class="drag-handle"><span><i></i><i></i><i></i></span><span><i></i><i></i><i></i></span></div>';}

// ═══════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════
var SK={budget:'ld-budget-v2',epargne:'ld-epargne-v2',investissements:'ld-invest-v1',objectifs:'ld-objectifs-v1',emprunts:'ld-emprunts-v1',patrimoine:'ld-patrimoine-v1'};
var SK_MONTHLY_EXP='life-dashboard-monthly-expenses-total';
var SK_MONTHLY_SAL='life-dashboard-monthly-salary-total';
var REVENUE_CATEGORIES=['Salaire','Rente'];
function load(k,def){try{var s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return typeof def==='function'?def():def}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ═══════════════════════════════════════════════════
// PLAFONDS
// ═══════════════════════════════════════════════════
var PLAFONDS={'Livret A':22950,'LDDS':12000,'LEP':10000,'PEL':61200,'Livret Jeune':1600,'CEL':15300,'PEA':150000};

// ═══════════════════════════════════════════════════
// BUDGET STATE
// ═══════════════════════════════════════════════════
var EXPENSE_CATEGORIES=['Logement','Vie quotidienne','Abonnements','Loisirs','Transport','Santé','Autre'];
var CLR_LAVENDER='#B8C4E8';
var SANKEY_COLORS={'Investissements mensuels':{node:'#E8913A',flow:'#E8913A',subNode:'#FFB74D',subFlow:'#FFB74D'},'Logement':{node:'#F5C842',flow:'#F5C842',subNode:'#E57373',subFlow:'#E57373'},'Vie quotidienne':{node:'#F5C842',flow:'#F5C842',subNode:'#4DB6AC',subFlow:'#4DB6AC'},'Abonnements':{node:'#F5C842',flow:'#F5C842',subNode:'#9575CD',subFlow:'#9575CD'},'Loisirs':{node:'#F5C842',flow:'#F5C842',subNode:'#7986CB',subFlow:'#7986CB'},'Transport':{node:'#F5C842',flow:'#F5C842',subNode:'#4DD0E1',subFlow:'#4DD0E1'},'Santé':{node:'#F5C842',flow:'#F5C842',subNode:'#81C784',subFlow:'#81C784'},'Autre':{node:'#F5C842',flow:'#F5C842',subNode:'#90A4AE',subFlow:'#90A4AE'}};
var SANKEY_SUB_COLORS={'Loyer':'#E57373','Charges':'#F06292','Courses':'#4DB6AC','Restaurants':'#7986CB','Abonnements':'#9575CD','Internet':'#4DD0E1','Téléphone':'#4DD0E1','Sport':'#81C784','Actions':'#FFB74D','PEA':'#FFB74D','CTO':'#FFB74D','Crypto':'#FFB74D','Assurance vie':'#FF8A65','Netflix':'#9575CD','Spotify':'#9575CD','Gym':'#81C784','EDF':'#F06292','Eau':'#4DD0E1'};
var SANKEY_SUB_PALETTE=['#E57373','#F06292','#4DB6AC','#7986CB','#9575CD','#4DD0E1','#81C784','#FFB74D','#FF8A65','#BA68C8','#4FC3F7','#AED581','#FFD54F','#A1887F'];
function skClr(c,p){return(SANKEY_COLORS[c]||SANKEY_COLORS['Autre'])[p]}

var budgetState=load(SK.budget,function(){return{revenus:[],investissements:[],depenses:[]}});

function getScopedMetrics(cat){
if(cat==='financier'){
var tot=totalInvestFin();var gains=totalGainsFin();var cap=tot-gains;
var wR=0,wER=0;
if(tot>0){
investState.financier.forEach(function(a){
var bal=pf(a.balance);var gEur=a.gainMode==='eur'?pf(a.gain):(bal>0&&pf(a.gain)>0?bal*pf(a.gain)/100:0);
var invested=bal-gEur;if(invested>0){wR+=invested*(gEur/invested*100)}
});

wER=weightedExpectedReturn();
}

}

var gains=0,wR=0,wER=0,totPP=0,totVal=0;
investState.immobilier.forEach(function(p){

var brute=isM?(pf(p.valeurBrute)||estimatedValueInv(p)):estimatedValueInv(p);
var pp=pf(p.purchasePrice);
var g=brute-pp;gains+=g;
if(pp>0){wR+=pp*((brute-pp)/pp*100);totPP+=pp}
var appr=pf(p.appreciation||2);totVal+=brute;
wER+=brute*appr;
});

if(totVal>0)wER=wER/totVal; else wER=2;
return{totalNet:totNet,capitalInvesti:totNet-gains,gains:gains,rendementActuel:wR,rendementAttendu:wER,monthlyContrib:0}
}
if(cat==='autre'){

var gains=0,wR=0,wER=0,totPP=0,totCV=0;
investState.autre.forEach(function(a){
var isM=a.valuationMode==='manual';
var cv=isM?pf(a.currentValue):calcAutreCurrentValue(a);
var pp=pf(a.purchasePrice||a.value);
var g=cv-pp;gains+=g;
if(pp>0){wR+=pp*((cv-pp)/pp*100);totPP+=pp}
var rend=pf(a.rendement||0);totCV+=cv;
wER+=cv*rend;
});
if(totPP>0)wR=wR/totPP; else wR=0;
if(totCV>0)wER=wER/totCV; else wER=0;
return{totalNet:totNet,capitalInvesti:totNet-gains,gains:gains,rendementActuel:wR,rendementAttendu:wER,monthlyContrib:0}
}
var f=getScopedMetrics('financier'),im=getScopedMetrics('immobilier'),au=getScopedMetrics('autre');

function renderBudgetList(){var items=budgetState[budgetEditTab]||[];var isDep=budgetEditTab==='depenses';var isRev=budgetEditTab==='revenus';var labels={revenus:'source de revenu',investissements:'investissement',depenses:'dépense'};var h='';items.forEach(function(item,i){h+='<div class="item-row" data-bi="'+i+'">'+dragH()+'<input class="item-label" value="'+escHTML(item.label)+'" placeholder="Libellé" data-bf="label" data-bi="'+i+'">'+(isDep?'<select class="cat-select" data-bf="categorie" data-bi="'+i+'">'+EXPENSE_CATEGORIES.map(function(c){return '<option value="'+c+'"'+(item.categorie===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>':'')+(isRev?'<select class="cat-select" data-bf="revCategorie" data-bi="'+i+'">'+REVENUE_CATEGORIES.map(function(c){return '<option value="'+c+'"'+((item.revCategorie||'Salaire')===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>':'')+'<input class="item-amount" value="'+(item.amount||'')+'" placeholder="0" data-bf="amount" data-bi="'+i+'" inputmode="decimal"><span class="item-currency">€</span><button class="item-delete" data-bdel="'+i+'" title="Supprimer">'+ICON_TRASH+'</button></div>'});h+='<button class="add-btn" id="b-add">'+ICON_PLUS+' Ajouter une '+labels[budgetEditTab]+'</button>';return h}

function attachBudgetEvents(el){el.querySelectorAll('[data-bf]').forEach(function(inp){var h=function(){var i=+inp.dataset.bi,f=inp.dataset.bf;var items=budgetState[budgetEditTab];if(items[i]){items[i][f]=inp.value;saveBudget();updateBudgetComputed()}};inp.addEventListener('input',h);inp.addEventListener('change',h)});el.querySelectorAll('[data-bdel]').forEach(function(b){b.onclick=function(){budgetState[budgetEditTab].splice(+b.dataset.bdel,1);saveBudget();renderBudget()}});var addBtn=el.querySelector('#b-add');if(addBtn)addBtn.onclick=function(){var it={id:genId(),label:'',amount:''};if(budgetEditTab==='depenses')it.categorie='Vie quotidienne';if(budgetEditTab==='revenus')it.revCategorie='Salaire';budgetState[budgetEditTab].push(it);saveBudget();renderBudget();setTimeout(function(){var ins=el.querySelectorAll('.item-label');if(ins.length)ins[ins.length-1].focus()},50)}}

function updateBudgetComputed(){var t=budgetTotals();var el=document.getElementById('page-budget');var sm=el.querySelector('.summary-text');if(sm){var d=document.createElement('div');d.innerHTML=renderBudgetSummary(t);var ns=d.querySelector('.summary-text');if(ns)sm.outerHTML=ns.outerHTML}var sk=document.getElementById('sankey-card');if(sk)sk.innerHTML=renderSankey(t);var gc=el.querySelectorAll('.grid-2 .card');if(gc[0])gc[0].innerHTML=renderGauge(t);if(gc[1])gc[1].innerHTML=renderBudgetTable(t)}

function renderBudgetSummary(t){if(t.rev===0&&t.inv===0&&t.dep===0)return '<div class="summary-text" style="text-align:center;color:var(--text-muted)">Ajoutez vos revenus, investissements et dépenses pour voir le résumé.</div>';return '<div class="summary-text">Votre taux d\'épargne est de <span class="highlight">'+Math.round(t.tauxEpargne)+' %</span> (taux d\'épargne possible : <strong>'+Math.round(t.tauxPossible)+' %</strong>). Vous avez un revenu total de <strong>'+fmt(t.rev)+' €</strong>, des dépenses de <strong>'+fmt(t.dep)+' €</strong> et investissez <strong>'+fmt(t.inv)+' €</strong> tous les mois'+(t.reste>=0?', il vous reste <span class="highlight">'+fmt(t.reste)+' €</span> disponible':', vous dépassez votre budget de <span style="color:var(--red);font-weight:600">'+fmt(Math.abs(t.reste))+' €</span>')+'.</div>'}

function renderBudgetTable(t){var rows=[{l:'Total Revenus',v:t.rev,c:'positive'},{l:'Total Investissements',v:t.inv,c:'accent-val'},{l:'Total Dépenses',v:t.dep,c:'negative'},{l:'Reste disponible',v:t.reste,c:t.reste>=0?'positive':'negative'},{l:"Taux d'épargne",v:null,d:Math.round(t.tauxEpargne)+' %',c:'accent-val'}];return '<table class="summary-table"><thead><tr><th>Poste</th><th style="text-align:right">Montant</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="label">'+r.l+'</td><td class="value '+r.c+'">'+(r.d||fmt(r.v)+' €')+'</td></tr>'}).join('')+'</tbody></table>'}

// ─── SANKEY ───
function renderSankey(t){if(!(t.rev>0||(t.inv+t.dep)>0))return '<div class="sankey-empty">'+ICON_FLOW+'<p>Ajoutez des revenus et des dépenses<br>pour visualiser vos flux financiers.</p></div>';var W=1100,H=440,PAD=20,colX=[PAD,W*.26,W*.54,W*.80],nodeW=14,gap=6,minH=16;var revNodes=budgetState.revenus.filter(function(r){return pf(r.amount)>0}).map(function(r){return{label:r.label||'Revenu',val:pf(r.amount),col:0,color:CLR_LAVENDER}});var budgetVal=revNodes.reduce(function(s,n){return s+n.val},0);var budgetNode={label:'Budget',val:budgetVal,col:1,color:CLR_LAVENDER};var invItems=budgetState.investissements.filter(function(i){return pf(i.amount)>0});var depItems=budgetState.depenses.filter(function(i){return pf(i.amount)>0});var catMap={};if(invItems.length>0)catMap['Investissements mensuels']={val:invItems.reduce(function(s,i){return s+pf(i.amount)},0),items:invItems,isInvest:true};depItems.forEach(function(item){var c=item.categorie||'Autre';if(!catMap[c])catMap[c]={val:0,items:[],isInvest:false};catMap[c].val+=pf(item.amount);catMap[c].items.push(item)});var catNodes=Object.entries(catMap).map(function(e){var k=e[0],v=e[1];var isInv=!!v.isInvest;return{label:k,val:v.val,col:2,color:isInv?'#E8913A':skClr(k,'node'),flowColor:isInv?'#E8913A':'#F5C842',items:v.items,isInvest:isInv}});var subColorIdx=0;var subNodes=[];catNodes.forEach(function(cat){cat.items.forEach(function(item){var lbl=item.label||'Élément';var subColor=SANKEY_SUB_COLORS[lbl];if(!subColor){for(var ww in SANKEY_SUB_COLORS){if(lbl.toLowerCase().indexOf(ww.toLowerCase())>=0){subColor=SANKEY_SUB_COLORS[ww];break}}}if(!subColor){subColor=SANKEY_SUB_PALETTE[subColorIdx%SANKEY_SUB_PALETTE.length];subColorIdx++}subNodes.push({label:lbl,val:pf(item.amount),col:3,color:subColor,flowColor:subColor,parent:cat.label})})});var totalFlow=Math.max(budgetVal,1);function layout(nodes,aH){var tg=gap*(Math.max(nodes.length,1)-1),uH=aH-tg;var y=0;nodes.forEach(function(n){n.h=Math.max((n.val/totalFlow)*uH,minH);n.y=y;y+=n.h+gap});var tH=y-(nodes.length?gap:0);var off=Math.max((aH-tH)/2,0);nodes.forEach(function(n){n.y+=off})}var aH=H-PAD*2;if(revNodes.length)layout(revNodes,aH);layout([budgetNode],aH);if(catNodes.length)layout(catNodes,aH);/* Bloc 3: align sub-items within parent cat height */if(subNodes.length>0&&catNodes.length>0){catNodes.forEach(function(cat){var ch=subNodes.filter(function(s){return s.parent===cat.label});if(!ch.length)return;var childTotalVal=ch.reduce(function(s,c){return s+c.val},0);if(childTotalVal<=0)return;var usableH=cat.h-gap*(Math.max(ch.length-1,0));var sY=cat.y;ch.forEach(function(c,ci){c.h=Math.max((c.val/childTotalVal)*usableH,2);c.y=sY;sY+=c.h+gap})})}else if(subNodes.length){layout(subNodes,aH)}var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs>';var gId=0;function addLink(x1,y1,h1,x2,y2,h2,cS,cE,op){op=op||.4;var g='sg'+(gId++),mx=(x1+x2)/2;svg+='<linearGradient id="'+g+'" x1="'+x1+'" y1="0" x2="'+x2+'" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="'+cS+'" stop-opacity="'+(op+.1)+'"/><stop offset="100%" stop-color="'+cE+'" stop-opacity="'+op+'"/></linearGradient>';svg+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+' L'+x2+','+(y2+h2)+' C'+mx+','+(y2+h2)+' '+mx+','+(y1+h1)+' '+x1+','+(y1+h1)+' Z" fill="url(#'+g+')"/>'}svg+='</defs>';if(revNodes.length){var ty=budgetNode.y;revNodes.forEach(function(rn){addLink(colX[0]+nodeW+PAD,rn.y+PAD,rn.h,colX[1]+PAD,ty+PAD,rn.h,CLR_LAVENDER,CLR_LAVENDER,.45);ty+=rn.h+gap})}if(catNodes.length){var sy=budgetNode.y;catNodes.forEach(function(cn){var bH=Math.max((cn.val/totalFlow)*(aH-(catNodes.length-1)*gap),minH);var fc=cn.isInvest?'#E8913A':'#F5C842';addLink(colX[1]+nodeW+PAD,sy+PAD,bH,colX[2]+PAD,cn.y+PAD,cn.h,CLR_LAVENDER,fc,.42);sy+=bH+gap})}catNodes.forEach(function(cat){var ch=subNodes.filter(function(s){return s.parent===cat.label});ch.forEach(function(child){addLink(colX[2]+nodeW+PAD,child.y+PAD,child.h,colX[3]+PAD,child.y+PAD,child.h,cat.flowColor||'#F5C842',child.flowColor,.38)})});function drawRect(n,x){var nx=x+PAD,ny=n.y+PAD;svg+='<rect x="'+nx+'" y="'+ny+'" width="'+nodeW+'" height="'+n.h+'" rx="5" fill="'+n.color+'" opacity=".92"/>'}revNodes.forEach(function(n){drawRect(n,colX[0])});drawRect(budgetNode,colX[1]);catNodes.forEach(function(n){drawRect(n,colX[2])});subNodes.forEach(function(n){drawRect(n,colX[3])});function drawLabelLeft(n,x,maxTw){var nx=x+PAD,ny=n.y+PAD,ly=ny+n.h/2;var nameStr=escSVG(n.label),valStr=fmt(n.val)+' \u20ac';var tw=Math.max(nameStr.length*6.5,valStr.length*6)+8;if(maxTw&&tw>maxTw)tw=maxTw;var lx=nx-tw-6;if(lx<2)lx=2;svg+='<text x="'+lx+'" y="'+(ly-1)+'" fill="#FFFFFF" font-weight="500" font-size="11" font-family="Inter,system-ui,sans-serif">'+nameStr+'</text>';svg+='<text x="'+lx+'" y="'+(ly+11)+'" fill="#FFFFFF" font-weight="600" font-size="10.5" font-family="Inter,system-ui,sans-serif" opacity=".85">'+valStr+'</text>'}revNodes.forEach(function(n){drawLabelLeft(n,colX[0])});drawLabelLeft(budgetNode,colX[1]);catNodes.forEach(function(n){drawLabelLeft(n,colX[2])});subNodes.forEach(function(n){drawLabelLeft(n,colX[3])});svg+='</svg>';return svg}
function renderGauge(t){var rate=Math.min(Math.max(t.tauxEpargne,0),100),possible=Math.min(Math.max(t.tauxPossible,0),100);var cx=110,cy=110,r=85,sw=14,sA=Math.PI,eA=2*Math.PI;function arc(s,e){var x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e),lg=(e-s)>Math.PI?1:0;return 'M'+x1+','+y1+' A'+r+','+r+' 0 '+lg+' 1 '+x2+','+y2}var bg=arc(sA,eA),pA=sA+(possible/100)*Math.PI,rA=sA+(rate/100)*Math.PI;return '<div class="gauge-wrapper"><svg class="gauge-svg" viewBox="0 0 220 130"><path d="'+bg+'" fill="none" stroke="var(--border)" stroke-width="'+sw+'" stroke-linecap="round"/>'+(possible>0?'<path d="'+arc(sA,pA)+'" fill="none" stroke="#3A3A50" stroke-width="'+sw+'" stroke-linecap="round"/>':'')+(rate>0?'<path d="'+arc(sA,rA)+'" fill="none" stroke="var(--accent)" stroke-width="'+sw+'" stroke-linecap="round"/>':'')+'</svg><div class="gauge-value">'+Math.round(rate)+' %</div><div class="gauge-label">Taux d\'épargne actuel</div><div class="gauge-sublabel"><span class="dot" style="background:#3A3A50"></span> Possible : '+Math.round(possible)+' % <span class="dot" style="background:var(--accent);margin-left:10px"></span> Actuel : '+Math.round(rate)+' %</div></div>'}

function renderEpargne(){var el=document.getElementById('page-epargne');var tot=totalEpargne(),wR=weightedRateEp();var proj10=epargneState.reduce(function(s,a){return s+compound(pf(a.balance),pf(a.rate),10)},0);var h='<h2 class="section-title">Épargne <span class="section-subtitle">— Livrets, comptes réglementés et courant</span></h2><div class="grid-3" id="ep-kpis"><div class="card kpi"><div class="kpi-value gold" id="ep-kpi-total">'+fmt(tot)+' €</div><div class="kpi-label">Épargne totale</div></div><div class="card kpi"><div class="kpi-value" id="ep-kpi-rate">'+fmtDec(wR,1)+' %</div><div class="kpi-label">Rendement moyen pondéré</div></div><div class="card kpi"><div class="kpi-value green" id="ep-kpi-proj10">'+fmt(Math.round(proj10))+' €</div><div class="kpi-label">Projection à 10 ans</div></div></div>';epargneState.forEach(function(acc,i){var bal=pf(acc.balance),plafond=PLAFONDS[acc.type];var hasCeiling=!!plafond;var pctFill=hasCeiling?(bal/plafond*100):0;var overPlafond=hasCeiling&&bal>plafond;var completionStr=hasCeiling?'<span class="badge-plafond '+(overPlafond?'warning':'ok')+'" id="ep-badge-'+i+'">'+(overPlafond?'⚠️ ':'')+''+fmt(Math.round(bal))+' / '+fmt(plafond)+' €</span><span style="font-size:12px;color:var(--text-bright);margin-left:4px" id="ep-pct-'+i+'">'+Math.round(pctFill)+' %</span>':'';h+='<div class="card item-row" style="display:block;padding:16px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+dragH()+'<input class="ed-input" value="'+escHTML(acc.name)+'" placeholder="Nom du compte" data-ei="'+i+'" data-ef="name" style="max-width:200px"><select class="ed-select" data-ei="'+i+'" data-ef="type">'+EPARGNE_TYPES.map(function(t){return '<option value="'+t+'"'+(acc.type===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select><div class="field-group"><span class="field-label">Solde</span><input class="ed-amount" value="'+(acc.balance||'')+'" placeholder="0" data-ei="'+i+'" data-ef="balance" inputmode="decimal"><span class="item-currency">€</span></div><div class="field-group"><span class="field-label">Rendement</span><input class="ed-small" value="'+(acc.rate||'')+'" placeholder="0" data-ei="'+i+'" data-ef="rate" inputmode="decimal" style="width:50px"><span class="item-currency">%</span></div>'+completionStr+'<button class="item-delete" data-edel="'+i+'" title="Supprimer">'+ICON_TRASH+'</button></div></div>'});h+='<button class="add-btn" id="e-add">'+ICON_PLUS+' Ajouter un compte</button>';el.innerHTML=h;el.querySelectorAll('[data-ef]').forEach(function(inp){var fn=function(){var i=+inp.dataset.ei,f=inp.dataset.ef;if(epargneState[i]){epargneState[i][f]=inp.value;if(f==='type'){epargneState[i].rate=DEFAULT_RATES_EP[inp.value]||0;saveEpargne();renderEpargne();return}saveEpargne();updateEpargneComputed()}};inp.addEventListener('input',fn);inp.addEventListener('change',fn)});el.querySelectorAll('[data-edel]').forEach(function(b){b.onclick=function(){epargneState.splice(+b.dataset.edel,1);saveEpargne();renderEpargne()}});el.querySelector('#e-add').onclick=function(){epargneState.push({id:genId(),name:'',type:'Compte courant',balance:0,rate:0});saveEpargne();renderEpargne()}}

function updateEpargneComputed(){var tot=totalEpargne(),wR=weightedRateEp();var proj10=epargneState.reduce(function(s,a){return s+compound(pf(a.balance),pf(a.rate),10)},0);var k1=document.getElementById('ep-kpi-total');if(k1)k1.textContent=fmt(tot)+' €';var k2=document.getElementById('ep-kpi-rate');if(k2)k2.textContent=fmtDec(wR,1)+' %';var k3=document.getElementById('ep-kpi-proj10');if(k3)k3.textContent=fmt(Math.round(proj10))+' €';epargneState.forEach(function(acc,i){var bal=pf(acc.balance),plafond=PLAFONDS[acc.type];var badge=document.getElementById('ep-badge-'+i);if(badge&&plafond){var pctFill=bal/plafond*100;var over=bal>plafond;badge.className='badge-plafond '+(over?'warning':'ok');badge.innerHTML=(over?'⚠️ ':'')+fmt(Math.round(bal))+' / '+fmt(plafond)+' €'}var pctEl=document.getElementById('ep-pct-'+i);if(pctEl&&plafond){pctEl.textContent=Math.round(bal/plafond*100)+' %'}})}

function renderInvestissements(){var el=document.getElementById('page-investissements');var h='<h2 class="section-title">Investissements <span class="section-subtitle">— Portefeuille financier, immobilier et autres</span></h2><div class="pill-tabs" id="inv-subtabs"><button class="pill-tab'+(investSubTab==='general'?' active':'')+'" data-ist="general">📊 Général</button><button class="pill-tab'+(investSubTab==='financier'?' active':'')+'" data-ist="financier">💹 Financier</button><button class="pill-tab'+(investSubTab==='immobilier'?' active':'')+'" data-ist="immobilier">🏠 Immobilier</button><button class="pill-tab'+(investSubTab==='autre'?' active':'')+'" data-ist="autre">🎨 Autre</button></div><div id="inv-content">'+renderInvestContent()+'</div>';el.innerHTML=h;el.querySelectorAll('[data-ist]').forEach(function(b){b.onclick=function(){investSubTab=b.dataset.ist;renderInvestissements()}});attachInvestEvents(el)}

function renderInvestGeneral(){var m=getScopedMetrics('all');var totFin=totalInvestFin(),totImmo=totalInvestImmo(),totAutre=totalInvestAutre();var totImmoGross=totalInvestImmoGross(),totAutreGross=totalInvestAutreGross();var totBrut=totFin+totImmoGross+totAutreGross;var h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="card kpi"><div class="kpi-value gold">'+fmt(Math.round(totBrut))+' \u20ac</div><div class="kpi-label">Total brut</div></div><div class="card kpi"><div class="kpi-value" style="color:var(--accent)">'+fmt(Math.round(m.totalNet))+' \u20ac</div><div class="kpi-label">Total net</div></div><div class="card kpi"><div class="kpi-value">'+fmtDec(m.rendementActuel,1)+' %</div><div class="kpi-label">Rendement actuel moyen</div></div><div class="card kpi"><div class="kpi-value'+(m.gains>=0?' green':' red')+'">\u200b'+(m.gains>=0?'+':'')+fmt(Math.round(m.gains))+' \u20ac</div><div class="kpi-label">Plus-value totale</div></div></div>';var projRate=m.rendementAttendu||5;if(m.totalNet<=0)h+='<div class="card" style="padding:20px"><div class="section-title" style="margin-bottom:10px;font-size:15px">Projection globale</div><div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px">Ajoutez des investissements pour voir la projection.</div></div>';else{h+=buildProjectionChart('inv-gen',m.totalNet,projRate,investProjYears,[1,2,5,10,20,30,40],m.gains,m.monthlyContrib||0)}var slices=[{label:'Financier',value:totFin,color:'#7B8CDE'},{label:'Immobilier',value:Math.max(totImmo,0),color:'#60C090'},{label:'Autre',value:totAutre,color:'#E0C878'}];h+='<div class="card"><div class="section-title" style="margin-bottom:10px;font-size:15px">R\u00e9partition des investissements</div><div style="display:flex;justify-content:center;gap:40px;padding:20px 40px;flex-wrap:wrap">';slices.forEach(function(s){var pct=((totFin+Math.max(totImmo,0)+totAutre)>0?Math.round(s.value/(totFin+Math.max(totImmo,0)+totAutre)*100):0);h+='<div clas function buildProjectionChart(prefix,capital,rate,years,durations,currentGains,monthlyContrib){var W=1060,HH=280,PL=70,PR=30,PT=20,PB=35;var chartW=W-PL-PR,chartH=HH-PT-PB;var cg=currentGains||0;var mc=monthlyContrib||0;var capitalInvesti=capital-cg;var pts=[];for(var y=0;y<=years;y++){var r=rate/100;var growthFactor=Math.pow(1+r,y);var baseTotal=capitalInvesti*growthFactor+cg*growthFactor;var contribTotal=(mc>0&&r>0)?(mc*12*((growthFactor-1)/r)):(mc*12*y);var totalVal=baseTotal+contribTotal;var capY=capitalInvesti+mc*12*y;pts.push({year:y,total:totalVal,cap:capY})}var maxVal=Math.max.apply(null,pts.map(function(p){return Math.max(p.total,p.cap)}));if(maxVal<1)maxVal=1;function xP(i){return PL+(i/years)*chartW}function yP(v){return PT+chartH-((v/maxVal)*chartH)}var capPath='M'+xP(0)+','+yP(pts[0].cap);var totalPath='M'+xP(0)+','+yP(pts[0].total);pts.forEach(function(p,i){totalPath+=' L'+xP(i)+','+yP(p.total);capPath+=' L'+xP(i)+','+yP(p.cap)});var capFill=capPath+' L'+xP(years)+','+yP(0)+' L'+xP(0)+','+yP(0)+' Z';var gainsFill=totalPath;for(var j=pts.length-1;j>=0;j--)gainsFill+=' L'+xP(j)+','+yP(pts[j].cap);gainsFill+=' Z';var gridSvg='';for(var g=0;g<=4;g++){var gv=(maxVal/4)*g;var gy=yP(gv);gridSvg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>';gridSvg+='<text x="'+(PL-8)+'" y="'+(gy+4)+'" fill="#5a6b80" font-size="10" text-anchor="end" font-family="Inter,system-ui,sans-serif">'+(gv>=1000000?fmtDec(gv/1000000,1)+'M':fmt(Math.round(gv/1000))+'k')+'</text>'}var xLabels='';var xStep=years<=5?1:years<=10?2:5;for(var y2=0;y2<=years;y2+=xStep){xLabels+='<text x="'+xP(y2)+'" y="'+(HH-8)+'" fill="#5a6b80" font-size="10" text-anchor="middle" font-family="Inter,system-ui,sans-serif">'+(y2===0?'Auj.':(new Date().getFullYear()+y2))+'</text>'}var lastPt=pts[pts.length-1];var lastGain=Math.round(lastPt.total-capitalInvesti);var h='<div class="card" style="padding:20px"><div style="display:flex;align-items:c function updateObjectifsComputed(){var totalObj=objectifsState.length;var funded=objectifsState.filter(function(o){return objFunded(o)>=objTarget(o)&&objTarget(o)>0}).length;var overallPct=totalObj>0?objectifsState.reduce(function(s,o){var tgt=objTarget(o);return s+(tgt>0?Math.min(objFunded(o)/tgt,1):0)},0)/totalObj*100:0;var k1=document.getElementById('obj-kpi-count');if(k1)k1.textContent=totalObj;var k2=document.getElementById('obj-kpi-funded');if(k2)k2.textContent=funded;var k3=document.getElementById('obj-kpi-pct');if(k3)k3.textContent=Math.round(overallPct)+' %';objectifsState.forEach(function(obj,i){var target=objTarget(obj),current=objFunded(obj),pct=target>0?Math.min(current/target*100,100):0;var prog=document.getElementById('obj-progress-'+i);if(prog)prog.innerHTML='<div class="progress-wrap" style="flex:1"><div class="progress-bar'+(pct>=100?' green':'')+'" style="width:'+pct+'%"></div></div><span style="font-size:13px;font-weight:600;color:var(--text-bright);min-width:50px;text-align:right">'+Math.round(pct)+' %</span>';var fnd=document.getElementById('obj-funded-'+i);if(fnd)fnd.textContent=fmt(Math.round(current))+' € financés sur '+fmt(Math.round(target))+' €';var mv=document.getElementById('obj-matelas-val-'+i);if(mv){var dep=getMonthlyExpenses();var m=pf(obj.moisMatelas);if(dep>0&&m>0){mv.innerHTML='= '+fmt(Math.round(dep*m))+' €'}else if(m>0){mv.innerHTML='⚠️ Renseignez vos dépenses dans l\'onglet Budget'}else{mv.textContent='= 0 €'}}})}

function getInsuranceMonthly(loan,balance){var base=(loan.insBase||'initial')==='restant'&&balance!==undefined?balance:pf(loan.capital);if((loan.insDisplayMode||'pct')==='pct'){return base*pf(loan.insurance)/100/12}return pf(loan.insurance)}

function computeAmortSchedule(loan){var cap=pf(loan.capital),annualRate=pf(loan.rate),durMonths=pf(loan.durationMonths);var rateM=annualRate/100/12;var diffType=loan.differeType||'aucun';var diffMonths=pf(loan.differeMois);var durDisplayMode=loan.durDisplayMode||'mois';if(diffType!=='aucun'&&durDisplayMode==='ans'){diffMonths=Math.round(diffMonths*12)}var insBase=loan.insBase||'initial';var insMonthlyFixed=getInsuranceMonthly(loan);var startDate=loan.startDate?new Date(loan.startDate):null;var schedule=[];var bal=cap;if(bal<=0||durMonths<=0)return{schedule:[],totalInterest:0,totalInsurance:0,totalCost:0,mensualiteCalc:0};var repayMonths=Math.max(durMonths,1);var mensCalc=0;if(rateM>0){mensCalc=bal*rateM/(1-(Math.pow(1+rateM,-repayMonths)))}else{mensCalc=bal/repayMonths}var actualBal=bal;if(diffType==='total'&&diffMonths>0){for(var d=0;d<diffMonths;d++){var intM=actualBal*rateM;actualBal+=intM;var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal):insMonthlyFixed;schedule.push({month:d+1,capital:0,interest:intM,insurance:insM,balance:actualBal,payment:insM,isDeferral:true,deferralType:'total'})}if(rateM>0){mensCalc=actualBal*rateM/(1-(Math.pow(1+rateM,-repayMonths)))}else{mensCalc=actualBal/repayMonths}}else if(diffType==='partiel'&&diffMonths>0){for(var d=0;d<diffMonths;d++){var intM=actualBal*rateM;var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal):insMonthlyFixed;schedule.push({month:d+1,capital:0,interest:intM,insurance:insM,balance:actualBal,payment:intM+insM,isDeferral:true,deferralType:'partiel'})}}var m=diffMonths;while(actualBal>0.5&&m<720){m++;var intM=actualBal*rateM;var capM=Math.min(mensCalc-intM,actualBal);if(capM<0)capM=0;actualBal=Math.max(actualBal-capM,0);var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal+capM):insMonthlyFixed;schedule.push({month:m,capital:capM,interest:intM,insurance:insM,balance:actualBal,payment:capM+intM+insM,isDeferral:false})}var totalInt=schedule.reduce(function(s,r){return s+r.interest},0);if(diffType==='total'&&diffMonths>0){var origBal=cap;var balAfterDiff=origBal;for(var dd=0;dd<diffMonths;dd++){balAfterDiff=balAfterDiff*(1+rateM)}var capitalizedInt=balAfterDiff-origBal;totalInt=capitalizedInt+schedule.filter(function(r){return !r.isDeferral}).reduce(function(s,r){return s+r.interest},0)}var totalIns=schedule.reduce(function(s,r){return s+r.insurance},0);return{schedule:schedule,totalInterest:totalInt,totalInsurance:totalIns,totalCost:totalInt+totalIns,mensualiteCalc:mensCalc,diffMonths:diffMonths}}

function renderEmpInfo(loan,sched){if(!sched)sched=computeAmortSchedule(loan);var remMonths=sched.schedule.length;var elapsed=0;if(loan.startDate&&pf(loan.durationMonths)>0){var sd=new Date(loan.startDate),now=new Date();elapsed=Math.max(0,(now.getFullYear()-sd.getFullYear())*12+(now.getMonth()-sd.getMonth()))}var remaining=Math.max(remMonths-elapsed,0);var diffInfo='';if(sched.diffMonths>0){var diffType=loan.differeType||'aucun';diffInfo=' · Différé : <strong style="color:var(--amber)">'+sched.diffMonths+' mois ('+(diffType==='total'?'total':'partiel')+')</strong>'}return 'Durée restante : <strong style="color:var(--text-bright)">'+(remaining>0?remaining+' mois':'—')+'</strong>'+diffInfo+' · Intérêts totaux : <strong style="color:var(--text-bright)">'+fmt(Math.round(sched.totalInterest))+' €</strong> · Assurance totale : <strong style="color:var(--text-bright)">'+fmt(Math.round(sched.totalInsurance))+' €</strong> · Coût total : <strong style="color:var(--text-bright)">'+fmt(Math.round(sched.totalCost))+' €</strong>'}

function updateEmpruntsComputed(){var hcsf=computeHCSF();var hasSalary=hcsf.salary>0;var k2=document.getElementById('emp-kpi-mens');if(k2)k2.textContent=fmt(Math.round(hcsf.totM))+' €/mois';var k3=document.getElementById('emp-kpi-capacite');if(k3)k3.textContent=hasSalary?fmt(Math.round(hcsf.capaciteMens))+' €/mois':'—';var k4=document.getElementById('emp-kpi-taux');if(k4){k4.textContent=hasSalary?fmtDec(hcsf.tauxEndettement,1)+' %':'—';k4.className='kpi-value'+(hcsf.tauxEndettement>35?' red':(hcsf.tauxEndettement>=33?' gold':' green'))}var kR=document.getElementById('emp-kpi-restant');if(kR){kR.innerHTML=hasSalary?renderCapaciteRestante(hcsf,empruntsAssumedRate):'<div class="kpi-value" style="font-size:20px">—</div><div class="kpi-label">Capacité d\'emprunt restante</div>';var rateInp=kR.querySelector('#emp-assumed-rate');if(rateInp){var rFn=function(){empruntsAssumedRate=pf(rateInp.value)||3.5;updateEmpruntsComputed()};rateInp.addEventListener('input',rFn);rateInp.addEventListener('change',rFn)}}empruntsState.forEach(function(loan,i){var sched=computeAmortSchedule(loan);var mensCalc=sched.mensualiteCalc||0;var insMonthly=getInsuranceMonthly(loan);var outstandingCalc=calcLoanOutstanding(loan);var calcEl=document.getElementById('emp-calc-'+i);if(calcEl){calcEl.innerHTML='<span style="font-size:12px;color:var(--text-muted)">Mensualité : <strong style="color:var(--accent)">'+fmt(Math.round(mensCalc+insMonthly))+' €/mois</strong>'+(insMonthly>0?' <span style="font-size:10px">(dont '+fmt(Math.round(insMonthly))+' € d\'assurance'+((loan.insBase||'initial')==='restant'?' – base restant':'')+')</span>':'')+'</span><span style="font-size:12px;color:var(--text-muted)">Capital restant dû : <strong style="color:var(--text-bright)">'+fmt(Math.round(outstandingCalc))+' €</strong></span>'}var info=document.getElementById('emp-info-'+i);if(info)info.innerHTML=renderEmpInfo(loan,sched);var amort=document.getElementById('amort-'+i);if(amort&&amort.style.display!=='none')amort.innerHT rsJson=JSON.stringify(bars).replace(/'/g,"\\'");svg+='<div id="amort-chart-tooltip" style="display:none;position:fixed;pointer-events:none;background:rgba(19,21,38,0.95);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;z-index:200;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)"></div>';svg+='<script type="text/json" class="amort-bars-data">'+barsJson+'<\/script>';return '<div style="position:relative">'+svg+'</div>'}

function computePatrimoine(){var totEp=totalEpargne(),totInvFin=totalInvestFin(),totInvImmoGross=totalInvestImmoGross(),totInvAutre=totalInvestAutreGross();var totalActifs=totEp+totInvFin+totInvImmoGross+totInvAutre;var totEmpr=totalDette(),totAutresD=(patrimoineState.autresDettes||[]).reduce(function(s,d){return s+pf(d.amount)},0);return{totEp:totEp,totInvFin:totInvFin,totInvImmoGross:totInvImmoGross,totInvAutre:totInvAutre,totalActifs:totalActifs,totEmpr:totEmpr,totAutresD:totAutresD,totalPassifs:totEmpr+totAutresD,net:totalActifs-totEmpr-totAutresD}}

function updatePatrimoineComputed(){var p=computePatrimoine();var nv=document.getElementById('pat-net-val');if(nv)nv.textContent=fmt(Math.round(p.net))+' €';var emv=document.getElementById('pat-empr-val');if(emv)emv.textContent=fmt(Math.round(p.totEmpr))+' €';var slices=[{label:'Épargne',value:p.totEp,color:'#C8956C'},{label:'Invest. financier',value:p.totInvFin,color:'#7B8CDE'},{label:'Invest. immobilier',value:p.totInvImmoGross,color:'#60C090'},{label:'Invest. autre',value:p.totInvAutre,color:'#E0C878'}];var dc=document.getElementById('pat-donut-card');if(dc)dc.innerHTML='<div class="section-title" style="margin-bottom:10px;font-size:15px">Composition des actifs</div>'+renderDonut(slices,p.totalActifs);var pc=document.getElementById('proj-chart');if(pc)pc.innerHTML=renderProjectionChart();var st=document.getElementById('pat-summary-table');if(st)st.innerHTML=renderPatrimoineSummaryTable()}

function renderProjectionChart(){var years=projectionRange;var W=1060,H=300,PL=70,PR=20,PT=20,PB=40;var chartW=W-PL-PR,chartH=H-PT-PB;var totEp=totalEpargne(),wREp=weightedRateEp(),totFin=totalInvestFin(),wRFin=weightedRateInv();var totImmoGross=totalInvestImmoGross(),totAutre=totalInvestAutre();var monthlyInv=budgetState.investissements?budgetState.investissements.reduce(function(s,i){return s+pf(i.amount)},0):0;var totDet=totalDette(),totAutresD=(patrimoineState.autresDettes||[]).reduce(function(s,d){return s+pf(d.amount)},0);var currentNet=totEp+totFin+totImmoGross+totAutre-totDet-totAutresD;var pts=[];for(var y=0;y<=years;y++){var epVal=compound(totEp,wREp||2,y);var finVal=compound(totFin,wRFin||5,y);var contribs=0;if(monthlyInv>0){var r2=Math.max((wRFin||5),1)/100/12;var n2=y*12;contribs=monthlyInv*((Math.pow(1+r2,n2)-1)/r2)}var immoVal=totImmoGross*Math.pow(1.02,y);var autreVal=totAutre*Math.pow(1.01,y);var tMens=totalMensualites();var debtRemaining=Math.max(totDet-tMens*12*y,0);var totalAssets=epVal+finVal+contribs+immoVal+autreVal;var netVal=totalAssets-debtRemaining-totAutresD;var capitalInvested=currentNet+monthlyInv*12*y;pts.push({year:y,capitalNet:capitalInvested,total:netVal,ep:Math.round(epVal),fin:Math.round(finVal+contribs),immo:Math.round(immoVal),autre:Math.round(autreVal),debt:Math.round(debtRemaining),ad:Math.round(totAutresD)})}if(pts.length<2||(currentNet===0&&monthlyInv===0))return '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px">Ajoutez des actifs pour voir la projection.</div>';var maxVal=1,minVal=0;pts.forEach(function(p){if(p.total>maxVal)maxVal=p.total;if(p.capitalNet<minVal)minVal=p.capitalNet});var range=maxVal-minVal||1;function xPos(i){return PL+(i/(pts.length-1))*chartW}function yPos(v){return PT+chartH-(((v-minVal)/range)*chartH)}var capitalPath='M'+xPos(0)+','+yPos(pts[0].capitalNet);var totalPath='M'+xPos(0)+','+yPos(pts[0].total);pts.forEach(function(p,i){totalPath+=' L'+xPos(i)+','+yPos(p.total);capitalPath+=' L'+xPos(i)+','+yPos(p.capitalNet)});var capitalFill=capitalPath+' L'+xPos(pts.length-1)+','+yPos(0)+' L'+xPos(0)+','+yPos(0)+' Z';var gainsFill=totalPath;for(var j=pts.length-1;j>=0;j--)gainsFill+=' L'+xPos(j)+','+yPos(pts[j].capitalNet);gainsFill+=' Z';var gridSvg='';for(var g=0;g<=5;g++){var val=minVal+(range/5)*g;var gy=yPos(val);gridSvg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>';gridSvg+='<text x="'+(PL-8)+'" y="'+(gy+4)+'" fill="#5a6b80" font-size="10" text-anchor="end" font-family="Inter,system-ui,sans-serif">'+(val>=1000000?fmtDec(val/1000000,1)+'M':val>=1000?fmt(Math.round(val/1000))+'k':fmt(Math.round(val)))+'</text>'}var xLabels='';var xStep=pts.length<=6?1:pts.length<=12?2:Math.ceil(pts.length/6);var now=new Date();pts.forEach(function(p,i){if(i%xStep===0||i===pts.length-1){xLabels+='<text x="'+xPos(i)+'" y="'+(H-8)+'" fill="#5a6b80" font-size="10" text-anchor="middle" font-family="Inter,system-ui,sans-serif">'+(p.year===0?'Auj.':(now.getFullYear()+p.year))+'</text>'}});var lastP=pts[pts.length-1];var ptsJson=JSON.stringify(pts.map(function(p){return{y:p.year,ep:p.ep,fin:p.fin,immo:p.immo,autre:p.autre,debt:p.debt,ad:p.ad,net:Math.round(p.total)}}));return '<div style="position:relative"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block" id="pat-proj-svg"><defs><linearGradient id="gCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF8F00" stop-opacity="0.4"/><stop offset="100%" stop-color="#FF8F00" stop-opacity="0.05"/></linearGradient><linearGradient id="gGains" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD600" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFD600" stop-opacity="0.05"/></linearGradient></defs>'+gridSvg+'<path d="'+capitalFill+'" fill="url(#gCap)"/><path d="'+gainsFill+'" fill="url(#gGains)"/><path d="'+capitalPath+'" fill="none" stroke="#FF8F00" stroke-width="1.5"/><path d="'+totalPath+'" fill="none" stroke="#FFD600" stroke-width="1.5"/>'+xLabels+'<text x="'+(xPos(pts.length-1)+8)+'" y="'+(yPos(lastP.total)-5)+'" fill="#FFD600" font-size="11" font-weight="600" font-family="Inter,system-ui,sans-serif">'+fmt(Math.round(lastP.total))+' €</text><circle cx="'+xPos(pts.length-1)+'" cy="'+yPos(lastP.total)+'" r="3" fill="#FFD600"/><circle cx="'+xPos(pts.length-1)+'" cy="'+yPos(lastP.capitalNet)+'" r="3" fill="#FF8F00"/><rect width="'+W+'" height="'+H+'" fill="transparent" class="pat-chart-hover" data-pts="'+escHTML(ptsJson)+'" data-pl="'+PL+'" data-chartw="'+chartW+'" data-years="'+years+'"/></svg><div id="pat-proj-tooltip" style="display:none;position:absolute;pointer-events:none;background:rgba(19,21,38,0.95);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12px;z-index:10;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)"></div></div><div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px"><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#FF8F00;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Capital net investi</span></span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#FFD600;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Gains projetés</span></span></div>'}
function renderDonut(slices,total){if(total<=0)return '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Aucun actif enregistré</div>';var sz=140,cx=sz/2,cy=sz/2,r=55,sw=22;var svg='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">';var cumAngle=-Math.PI/2;slices.filter(function(s){return s.value>0}).forEach(function(s){var angle=(s.value/total)*2*Math.PI;var x1=cx+r*Math.cos(cumAngle),y1=cy+r*Math.sin(cumAngle);cumAngle+=angle;var x2=cx+r*Math.cos(cumAngle),y2=cy+r*Math.sin(cumAngle);var large=angle>Math.PI?1:0;svg+='<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-linecap="butt"/>'});svg+='</svg>';var legend=slices.map(function(s){return '<div class="donut-legend-item"><div class="donut-legend-dot" style="background:'+s.color+'"></div>'+escHTML(s.label)+' : <strong style="color:var(--text-bright)">'+fmt(Math.round(s.value))+' €</strong> ('+(total>0?Math.round(s.value/total*100):0)+' %)</div>'}).join('');return '<div class="donut-wrap">'+svg+'<div class="donut-legend">'+legend+'</div></div>'}
